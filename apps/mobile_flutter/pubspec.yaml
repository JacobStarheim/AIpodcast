name: podcast_voice_ai
description: AI podcast voice Q&A prototype
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  flutter_secure_storage: ^11.2.0
  http: ^1.2.2
  just_audio: ^0.9.40
  path_provider: ^2.1.5
  record: ^5.2.1
  shared_preferences: ^2.5.6

dependency_overrides:
  record_linux:
    path: third_party/record_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
