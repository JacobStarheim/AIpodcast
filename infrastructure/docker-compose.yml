services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: podcast_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcast
      POSTGRES_DB: podcast_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast -d podcast_ai"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
