services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: podcast_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcast
      POSTGRES_DB: podcast_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast -d podcast_ai"]
      interval: 10s
      timeout: 5s
      retries: 6

# The schema lives in infrastructure/migrations and is applied by
# `npm run db:migrate` (also part of `npm run db:up`).
volumes:
  postgres_data:
